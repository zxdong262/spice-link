# This workflow exports build-related secrets to files and uploads them as artifacts
# so they can be downloaded and reused locally.

name: export-envs

on:
  push:
    branches: [ export-envs, dev1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-envs:
    runs-on: ubuntu-latest
    environment: build

    steps:
    - name: Export secrets to files
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLEID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        mkdir -p envs

        printf '%s' "$GH_TOKEN"                    > envs/GH_TOKEN
        printf '%s' "$BUILD_NUMBER"               > envs/BUILD_NUMBER
        printf '%s' "$CSC_LINK"                   > envs/CSC_LINK
        printf '%s' "$CSC_KEY_PASSWORD"           > envs/CSC_KEY_PASSWORD
        printf '%s' "$APPLE_ID"                   > envs/APPLE_ID
        printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" > envs/APPLE_APP_SPECIFIC_PASSWORD
        printf '%s' "$APPLE_TEAM_ID"              > envs/APPLE_TEAM_ID

        # Generate a combined .env file for convenience
        {
          echo "GH_TOKEN=$GH_TOKEN"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "CSC_LINK=$CSC_LINK"
          echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
          echo "APPLE_ID=$APPLE_ID"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
        } > envs/build-envs.env

        echo "Exported files:"
        ls -la envs/

    - name: Upload envs artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-envs
        path: envs/
        retention-days: 7
