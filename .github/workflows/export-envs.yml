# This workflow exports build-related secrets to files and uploads them as artifacts
# so they can be downloaded and reused locally.
#
# Secrets exported (matching mac-universal.yml):
#   DOWNLOAD_SRC_TOKEN, DOWNLOAD_URL, MAS_PROVISIONING_PROFILE,
#   GH_TOKEN, MAS_CSC_LINK, MAS_CSC_KEY_PASSWORD,
#   MAS_INSTALLER_CSC_LINK, MAS_INSTALLER_CSC_KEY_PASSWORD,
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

name: export-envs

on:
  push:
    branches: [ export-envs, test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-envs:
    runs-on: ubuntu-latest
    environment: build

    steps:
    - name: Export secrets to files
      env:
        DOWNLOAD_SRC_TOKEN: ${{ secrets.DOWNLOAD_SRC_TOKEN }}
        DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
        MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
        MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
        MAS_INSTALLER_CSC_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
        MAS_INSTALLER_CSC_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLEID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        mkdir -p envs

        printf '%s' "$DOWNLOAD_SRC_TOKEN"            > envs/DOWNLOAD_SRC_TOKEN
        printf '%s' "$DOWNLOAD_URL"                  > envs/DOWNLOAD_URL
        printf '%s' "$MAS_PROVISIONING_PROFILE"      > envs/MAS_PROVISIONING_PROFILE
        printf '%s' "$GH_TOKEN"                      > envs/GH_TOKEN
        printf '%s' "$MAS_CSC_LINK"                  > envs/MAS_CSC_LINK
        printf '%s' "$MAS_CSC_KEY_PASSWORD"          > envs/MAS_CSC_KEY_PASSWORD
        printf '%s' "$MAS_INSTALLER_CSC_LINK"        > envs/MAS_INSTALLER_CSC_LINK
        printf '%s' "$MAS_INSTALLER_CSC_KEY_PASSWORD" > envs/MAS_INSTALLER_CSC_KEY_PASSWORD
        printf '%s' "$APPLE_ID"                      > envs/APPLE_ID
        printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD"   > envs/APPLE_APP_SPECIFIC_PASSWORD
        printf '%s' "$APPLE_TEAM_ID"                 > envs/APPLE_TEAM_ID

        # Generate a combined .env file for convenience
        {
          echo "DOWNLOAD_SRC_TOKEN=$DOWNLOAD_SRC_TOKEN"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL"
          echo "MAS_PROVISIONING_PROFILE=$MAS_PROVISIONING_PROFILE"
          echo "GH_TOKEN=$GH_TOKEN"
          echo "MAS_CSC_LINK=$MAS_CSC_LINK"
          echo "MAS_CSC_KEY_PASSWORD=$MAS_CSC_KEY_PASSWORD"
          echo "MAS_INSTALLER_CSC_LINK=$MAS_INSTALLER_CSC_LINK"
          echo "MAS_INSTALLER_CSC_KEY_PASSWORD=$MAS_INSTALLER_CSC_KEY_PASSWORD"
          echo "APPLE_ID=$APPLE_ID"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
        } > envs/build-envs.env

        echo "Exported files:"
        ls -la envs/

    - name: Upload envs artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-envs
        path: envs/
        retention-days: 7
